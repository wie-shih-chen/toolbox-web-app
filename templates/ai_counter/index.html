{% extends "base.html" %}

{% block title %}AI 拍照計數 - CoreX{% endblock %}

{% block extra_css %}
<style>
  .counter-page {
    max-width: 620px;
    margin: 0 auto;
    padding-bottom: 60px;
    animation: fade-in 0.4s ease-out;
  }
  .counter-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .counter-header h1 {
    font-size: 1.8rem;
    font-weight: 800;
    color: #fff;
    margin-bottom: 6px;
  }
  .counter-header p {
    color: var(--text-secondary);
    font-size: 0.95rem;
  }
  .conv-card {
    background: var(--ios-bg);
    border: 1px solid var(--ios-border);
    border-radius: 20px;
    padding: 24px;
    backdrop-filter: var(--ios-blur);
  }
  .dropzone {
    border: 2px dashed rgba(78,205,196,0.35);
    border-radius: 16px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }
  .dropzone:hover {
    border-color: var(--accent-color);
    background: rgba(78,205,196,0.06);
  }
  .dropzone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .dropzone .dz-icon {
    font-size: 3rem;
    margin-bottom: 12px;
    display: block;
    color: var(--accent-color);
  }
  .dropzone .dz-title {
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }
  .dropzone .dz-sub {
    font-size: 0.82rem;
    color: var(--text-secondary);
  }
  .btn-convert {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent-color), #45b7af);
    border: none;
    border-radius: 14px;
    color: #0f172a;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
  }
  .btn-convert:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(78,205,196,0.4);
  }
  .btn-convert:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Canvas result area */
  #resultSection {
    display: none;
    margin-top: 20px;
  }
  #canvasWrapper {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(0,0,0,0.2);
    line-height: 0;
  }
  #resultCanvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 14px;
  }
  .count-badge {
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(78,205,196,0.12);
    border: 1px solid rgba(78,205,196,0.3);
    border-radius: 14px;
    padding: 16px 24px;
  }
  .count-number {
    font-size: 2.8rem;
    font-weight: 900;
    color: var(--accent-color);
    line-height: 1;
  }
  .count-label {
    font-size: 1rem;
    color: rgba(255,255,255,0.7);
    font-weight: 500;
  }
  .error-card {
    background: rgba(255,107,107,0.08);
    border: 1px solid rgba(255,107,107,0.25);
    border-radius: 14px;
    padding: 16px 20px;
    margin-top: 16px;
    color: #ff6b6b;
    font-size: 0.95rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="counter-page">
    <div class="counter-header">
        <h1>AI 拍照計數</h1>
        <p>上傳圖片，讓 AI 幫你自動圈出並計算物品數量</p>
    </div>

    <div class="conv-card">
        <form id="aiCounterForm" enctype="multipart/form-data">
            <div class="dropzone" id="dropzone">
                <input type="file" id="imageInput" name="image" accept="image/*" required>
                <span class="material-icons dz-icon">camera_alt</span>
                <div class="dz-title">點擊拍照或上傳圖片</div>
                <div class="dz-sub">支援 JPG, PNG 等常見格式</div>
            </div>

            <button type="submit" id="submitBtn" class="btn-convert">
                <span class="material-icons">auto_awesome</span> 開始分析
            </button>
        </form>

        <!-- Result Section -->
        <div id="resultSection">
            <div id="canvasWrapper">
                <canvas id="resultCanvas"></canvas>
            </div>
            <div class="count-badge">
                <div class="count-number" id="countNumber">0</div>
                <div class="count-label">個物件</div>
            </div>
        </div>

        <div id="errorCard" class="error-card" style="display:none;"></div>
    </div>
</div>

<script>
    const imageInput  = document.getElementById('imageInput');
    const form        = document.getElementById('aiCounterForm');
    const submitBtn   = document.getElementById('submitBtn');
    const resultSection = document.getElementById('resultSection');
    const canvas      = document.getElementById('resultCanvas');
    const ctx         = canvas.getContext('2d');
    const countNumber = document.getElementById('countNumber');
    const errorCard   = document.getElementById('errorCard');

    // Store loaded image so we can draw on it after analysis
    let loadedImage = null;

    imageInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = () => {
                    loadedImage = img;
                    // Preview without boxes
                    canvas.width  = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    ctx.drawImage(img, 0, 0);
                    resultSection.style.display = 'block';
                    countNumber.textContent = '—';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(this.files[0]);
        }
        errorCard.style.display = 'none';
    });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        if (!imageInput.files || !imageInput.files[0]) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="material-icons" style="animation:spin 1s linear infinite">hourglass_empty</span> 分析中...';
        errorCard.style.display = 'none';

        const formData = new FormData(form);

        try {
            const response = await fetch('{{ url_for("ai_counter.analyze") }}', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const data = await response.json();
                drawResults(data);
            } else {
                const data = await response.json().catch(() => ({}));
                showError(data.error || '伺服器回傳錯誤 ' + response.status);
            }
        } catch (err) {
            showError('連線失敗，請稍後再試。');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span class="material-icons">auto_awesome</span> 重新分析';
        }
    });

    function drawResults(data) {
        const objects = data.objects || [];
        const total   = data.total   || objects.length;

        if (!loadedImage) return;

        const W = loadedImage.naturalWidth;
        const H = loadedImage.naturalHeight;

        canvas.width  = W;
        canvas.height = H;

        // Draw original image
        ctx.drawImage(loadedImage, 0, 0);

        // Color palette (cycle)
        const COLORS = [
            '#FF5252','#FF9800','#FFEB3B','#4CAF50','#00BCD4',
            '#3F51B5','#9C27B0','#E91E63','#00E5FF','#76FF03'
        ];

        // Hue-based radius: estimate radius from box size (ellipse per object)
        objects.forEach((obj, idx) => {
            const [yn, xn, yn2, xn2] = obj.box;   // normalized 0~1000

            // Convert to pixel coords
            const x1 = xn  / 1000 * W;
            const y1 = yn  / 1000 * H;
            const x2 = xn2 / 1000 * W;
            const y2 = yn2 / 1000 * H;

            const cx = (x1 + x2) / 2;
            const cy = (y1 + y2) / 2;
            // 往外擴張 15%，讓圓框不要太緊
            const rx = Math.max((x2 - x1) / 2 * 1.15, 8);
            const ry = Math.max((y2 - y1) / 2 * 1.15, 8);

            const color = COLORS[idx % COLORS.length];

            // Draw ellipse outline
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
            ctx.strokeStyle = color;
            ctx.lineWidth = Math.max(2, Math.min(rx, ry) * 0.18);
            ctx.shadowColor = 'rgba(0,0,0,0.7)';
            ctx.shadowBlur = 4;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Label: small circle at center with number
            const label = String(idx + 1);
            const fontSize = Math.max(9, Math.min(rx, ry) * 0.7);
            ctx.font = `bold ${fontSize}px sans-serif`;
            const textW = ctx.measureText(label).width;
            const padX = Math.max(textW / 2 + 3, 6);
            const padY = fontSize * 0.6;

            // Background pill
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.85;
            ctx.beginPath();
            ctx.roundRect(cx - padX, cy - padY, padX * 2, padY * 2, padY);
            ctx.fill();
            ctx.globalAlpha = 1;

            // Number text
            ctx.fillStyle = '#000';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, cx, cy);
        });

        // Reset canvas state
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';

        // Update count badge
        countNumber.textContent = total;
        resultSection.style.display = 'block';
    }

    function showError(msg) {
        errorCard.textContent = '❌ ' + msg;
        errorCard.style.display = 'block';
    }

    // Spin keyframe
    if (!document.querySelector('style#spinKeyframe')) {
        const s = document.createElement('style');
        s.id = 'spinKeyframe';
        s.textContent = '@keyframes spin { 100% { transform: rotate(360deg); } }';
        document.head.appendChild(s);
    }
</script>
{% endblock %}
