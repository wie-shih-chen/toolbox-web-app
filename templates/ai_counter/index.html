{% extends "base.html" %}

{% block title %}AI 拍照計數 - CoreX{% endblock %}

{% block extra_css %}
<style>
  .counter-page {
    max-width: 600px;
    margin: 0 auto;
    padding-bottom: 60px;
    animation: fade-in 0.4s ease-out;
  }
  .counter-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .counter-header h1 {
    font-size: 1.8rem;
    font-weight: 800;
    color: #fff;
    margin-bottom: 6px;
  }
  .counter-header p {
    color: var(--text-secondary);
    font-size: 0.95rem;
  }
  .conv-card {
    background: var(--ios-bg);
    border: 1px solid var(--ios-border);
    border-radius: 20px;
    padding: 24px;
    backdrop-filter: var(--ios-blur);
  }
  .dropzone {
    border: 2px dashed rgba(78,205,196,0.35);
    border-radius: 16px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }
  .dropzone:hover {
    border-color: var(--accent-color);
    background: rgba(78,205,196,0.06);
  }
  .dropzone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .dropzone .dz-icon {
    font-size: 3rem;
    margin-bottom: 12px;
    display: block;
    color: var(--accent-color);
  }
  .dropzone .dz-title {
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }
  .dropzone .dz-sub {
    font-size: 0.82rem;
    color: var(--text-secondary);
  }
  #imagePreviewContainer {
    display: none;
    margin-top: 16px;
    text-align: center;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(0,0,0,0.2);
    padding: 10px;
  }
  #imagePreview {
    max-width: 100%;
    max-height: 300px;
    border-radius: 8px;
    object-fit: contain;
  }
  .btn-convert {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent-color), #45b7af);
    border: none;
    border-radius: 14px;
    color: #0f172a;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
  }
  .btn-convert:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(78,205,196,0.4);
  }
  .btn-convert:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  
  .result-card {
    display: none;
    background: rgba(46,213,115,0.08);
    border: 1px solid rgba(46,213,115,0.25);
    border-radius: 16px;
    padding: 20px;
    margin-top: 20px;
  }
  .result-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .result-icon {
    font-size: 1.6rem;
    color: var(--success-color);
  }
  .result-title {
    font-weight: 700;
    font-size: 1rem;
    color: #fff;
  }
  #resultText {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.9);
    white-space: pre-wrap;
    line-height: 1.6;
  }
  .error-card {
    background: rgba(255,107,107,0.08);
    border-color: rgba(255,107,107,0.25);
  }
  .error-card .result-icon, .error-card .result-title {
    color: var(--danger-color);
  }
</style>
{% endblock %}

{% block content %}
<div class="counter-page">
    <div class="counter-header">
        <h1>AI 拍照計數</h1>
        <p>上傳圖片，讓 AI 幫你自動算出物品數量</p>
    </div>

    <div class="conv-card">
        <form id="aiCounterForm" enctype="multipart/form-data">
            <div class="dropzone" id="dropzone">
                <input type="file" id="imageInput" name="image" accept="image/*" required>
                <span class="material-icons dz-icon">camera_alt</span>
                <div class="dz-title">點擊拍照或上傳圖片</div>
                <div class="dz-sub">支援 JPG, PNG 等常見格式</div>
            </div>

            <div id="imagePreviewContainer">
                <img id="imagePreview" src="" alt="預覽圖片">
            </div>

            <button type="submit" id="submitBtn" class="btn-convert">
                <span class="material-icons">auto_awesome</span> 開始分析
            </button>
        </form>
        
        <div id="resultBox" class="result-card">
            <div class="result-header">
                <span class="material-icons result-icon">check_circle</span>
                <span class="result-title">分析結果</span>
            </div>
            <div id="resultText"></div>
        </div>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const form = document.getElementById('aiCounterForm');
    const submitBtn = document.getElementById('submitBtn');
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');
    const resultIcon = resultBox.querySelector('.result-icon');
    const resultTitle = resultBox.querySelector('.result-title');

    imageInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                imagePreviewContainer.style.display = 'block';
            }
            reader.readAsDataURL(this.files[0]);
        } else {
            imagePreviewContainer.style.display = 'none';
        }
        resultBox.style.display = 'none';
    });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="material-icons" style="animation: spin 1s linear infinite;">hourglass_empty</span> 分析中...';
        resultBox.style.display = 'none';

        const formData = new FormData(form);

        try {
            const response = await fetch('{{ url_for("ai_counter.analyze") }}', {
                method: 'POST',
                body: formData
            });

            resultBox.style.display = 'block';
            if (response.ok) {
                const data = await response.json();
                resultBox.className = 'result-card';
                resultIcon.textContent = 'check_circle';
                resultTitle.textContent = '分析結果';
                resultText.textContent = data.result;
            } else {
                let errorMsg = '發生未知錯誤';
                try {
                    const data = await response.json();
                    errorMsg = data.error || errorMsg;
                } catch(e) {
                    errorMsg = '伺服器無回應 (狀態碼 ' + response.status + ')';
                }
                resultBox.className = 'result-card error-card';
                resultIcon.textContent = 'error';
                resultTitle.textContent = '分析失敗';
                resultText.textContent = errorMsg;
            }
        } catch (error) {
            console.error('Error:', error);
            resultBox.style.display = 'block';
            resultBox.className = 'result-card error-card';
            resultIcon.textContent = 'wifi_off';
            resultTitle.textContent = '網路錯誤';
            resultText.textContent = '連線失敗，請稍後再試。';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span class="material-icons">auto_awesome</span> 重新分析';
        }
    });

    // Add spin keyframe dynamically if not present
    if (!document.querySelector('style#spinKeyframe')) {
        const style = document.createElement('style');
        style.id = 'spinKeyframe';
        style.textContent = '@keyframes spin { 100% { transform: rotate(360deg); } }';
        document.head.appendChild(style);
    }
</script>
{% endblock %}
