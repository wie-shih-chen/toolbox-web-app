{% extends "base.html" %}
{% block title %}背單字設定{% endblock %}
{% block content %}
<div class="container" style="max-width: 600px; padding-bottom: 4rem;">
  <div style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem;">
    <a href="{{ url_for('vocab.index') }}" class="btn-secondary" style="padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; color: inherit;">
      <i class="fas fa-arrow-left"></i> 返回
    </a>
    <h2 style="margin: 0;">⚙️ 背單字設定</h2>
  </div>

  <div class="card" style="padding: 1.5rem; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);">
    <form method="POST" action="{{ url_for('vocab.settings') }}">
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="vocab_daily_goal" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">每日目標學習單字數</label>
        <input type="number" id="vocab_daily_goal" name="vocab_daily_goal" value="{{ settings.vocab_daily_goal if settings else 20 }}" min="1" max="1000" class="form-control" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); color: inherit; font-size: 1.1rem; outline: none;">
        <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">設定您每天想要複習或學習的新單字目標個數。此數字會顯示在首頁的進度條上。</small>
      </div>
      
      <button type="submit" class="btn-primary" style="width: 100%; padding: 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; border: none; font-size: 1rem;">儲存設定</button>
    </form>
  </div>

  <div class="card" style="margin-top: 2rem; padding: 1.5rem; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);">
    <h3 style="margin-top: 0; color: var(--danger, #ff4d4f);">危險區域</h3>
    <p style="color: var(--text-muted); margin-bottom: 1rem;">重新記錄將會刪除您所有背單字的進度（包含答對、答錯次數與歷史紀錄）。此動作無法復原！</p>
    <button type="button" class="btn-danger" style="width: 100%; padding: 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; border: 1px solid #ff4d4f; background: rgba(255, 77, 79, 0.1); color: #ff4d4f; font-size: 1rem;" onclick="resetVocabProgress()">重新記錄 (刪除所有進度)</button>
  </div>
</div>

<script>
async function resetVocabProgress() {
  if (!confirm("確定要刪除所有單字進度與歷史紀錄嗎？\n此動作無法復原！")) return;
  
  try {
    const res = await fetch('{{ url_for("vocab.reset_progress") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    });
    const data = await res.json();
    if (data.success) {
      alert("✅ 已成功刪除所有進度！");
      window.location.href = '{{ url_for("vocab.index") }}';
    } else {
      alert("❌ 刪除失敗: " + (data.error || "未知錯誤"));
    }
  } catch (err) {
    alert("❌ 發生錯誤，請稍後再試！");
  }
}
</script>
{% endblock %}
