{% extends "base.html" %}
{% block title %}背單字設定{% endblock %}
{% block content %}
<div class="container" style="max-width: 600px; padding-bottom: 4rem;">
  <div style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem;">
    <a href="{{ url_for('vocab.index') }}" class="btn-secondary" style="padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--border);">
      <i class="fas fa-arrow-left"></i> 返回
    </a>
    <h2 style="margin: 0;">⚙️ 背單字設定</h2>
  </div>

  <div class="card" style="padding: 1.5rem; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);">
    <form method="POST" action="{{ url_for('vocab.settings') }}">
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="vocab_daily_goal" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">每日目標學習單字數</label>
        <input type="number" id="vocab_daily_goal" name="vocab_daily_goal" value="{{ settings.vocab_daily_goal if settings else 20 }}" min="1" max="1000" class="form-control" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
        <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">設定您每天想要複習或學習的新單字目標個數。此數字會顯示在首頁的進度條上。</small>
      </div>
      
      <button type="submit" style="width: 100%; padding: 1rem; border-radius: 8px; font-weight: 600; background: var(--primary); color: #fff; border: none; cursor: pointer;">儲存設定</button>
    </form>
  </div>
</div>
{% endblock %}
