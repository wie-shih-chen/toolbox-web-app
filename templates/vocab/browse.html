{% extends 'base.html' %}
{% block title %}瀏覽單字 — TOEIC 背單字{% endblock %}

{% block extra_css %}
<style>
  .browse-container { width: 100%; max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; box-sizing: border-box; }
  .browse-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
  .browse-header a { 
    text-decoration: none; 
    color: var(--text-secondary); 
    font-size: 0.95rem; 
    font-weight: 500;
    transition: color 0.2s;
  }
  .browse-header a:hover { color: #fa709a; }
  
  .browse-count { 
    font-size: 0.85rem; 
    color: var(--text-secondary); 
    background: var(--card-bg, #fff);
    padding: 0.4rem 1rem;
    border-radius: 100px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    font-weight: 500;
  }

  .filter-bar { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: center; }
  .filter-bar select, .filter-bar input {
    padding: 0.6rem 1rem; 
    border-radius: 100px;
    border: 1px solid rgba(0,0,0,0.1); 
    background: var(--card-bg,#fff);
    font-size: 0.9rem; 
    transition: border-color 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  }
  .filter-bar select { cursor: pointer; flex: 1; min-width: 120px; }
  .filter-bar input { cursor: text; flex: 2; min-width: 180px; }
  .filter-bar select:hover, .filter-bar input:focus { border-color: #fa709a; outline: none; }

  .words-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }

  .word-card {
    background: var(--card-bg, #fff);
    border-radius: 20px;
    padding: 1.5rem;
    border: 1px solid rgba(128,128,128,0.2);
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    cursor: default;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow-wrap: break-word;
    word-wrap: break-word;
    word-break: break-word;
  }
  .word-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }

  .word-card .wc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8rem; }
  .word-card .wc-word { font-size: 1.4rem; font-weight: 800; color: #a5b4fc; display: flex; align-items: center; line-height: 1.2; letter-spacing: -0.5px; }
  .word-card .wc-star { font-size: 0.8rem; opacity: 0.9; }
  .word-card .wc-def { font-size: 1rem; color: var(--text-primary, #333); margin-bottom: 0.8rem; font-weight: 600; line-height: 1.4; }
  .word-card .wc-pos { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .pos-tag { background: rgba(102,126,234,0.15); color: #818cf8; border-radius: 100px; padding: 0.2rem 0.8rem; font-size: 0.75rem; font-weight: 600; }
  
  .word-card .wc-example { 
    font-size: 0.85rem; 
    color: var(--text-secondary, #777); 
    line-height: 1.6; 
    border-top: 1px solid rgba(128,128,128,0.2); 
    padding-top: 0.8rem; 
    margin-top: 0.8rem; 
  }
  .word-card .wc-example em { color: var(--text-primary, #444); font-weight: 600; font-style: normal; display: block; margin-bottom: 0.2rem; }
  
  .word-card .wc-cat { 
    font-size: 0.75rem; 
    color: var(--text-secondary); 
    font-weight: 500; 
    margin-top: auto;
    align-self: flex-end;
    padding-top: 0.5rem;
  }

  /* Progress dot */
  .progress-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; margin-right: 8px;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.8);
  }
  .dot-known { background: #22c55e; }
  .dot-learning { background: #f59e0b; }
  .dot-new { background: #d1d5db; }

  /* Load more */
  .load-more-btn {
    display: block; width: 100%; margin: 2rem 0;
    padding: 1rem; border-radius: 16px;
    background: linear-gradient(135deg, rgba(250, 112, 154, 0.1), rgba(254, 225, 64, 0.1)); 
    border: 1px solid rgba(250, 112, 154, 0.2);
    color: #f472b6; font-size: 1rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    box-sizing: border-box;
  }
  .load-more-btn:hover { background: linear-gradient(135deg, rgba(250, 112, 154, 0.15), rgba(254, 225, 64, 0.15)); transform: translateY(-2px); }
  .load-more-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

  .loading-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; padding: 4rem 1rem; color: var(--text-secondary); font-weight: 500; }
  .spinner { width: 48px; height: 48px; border: 4px solid rgba(250,112,154,0.2); border-top-color: #fa709a; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .browse-container { padding-top: 5.5rem; }
  }

  @media (max-width: 600px) {
    .filter-bar { flex-direction: column; align-items: stretch; gap: 0.6rem; }
    .filter-bar input, .filter-bar select { width: 100%; box-sizing: border-box; }
    .words-grid { grid-template-columns: 1fr; gap: 1rem; }
    .word-card { padding: 1.2rem; }
  }
  
  .toast-msg {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(46, 213, 115, 0.95);
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(46, 213, 115, 0.4);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
    z-index: 1000;
    pointer-events: none;
    font-size: 0.95rem;
  }
  .toast-msg.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
{% endblock %}

{% block content %}

<div class="browse-container">
  <div class="browse-header">
    <a href="{{ url_for('vocab.index') }}">← 返回學習中心</a>
    <div class="browse-count" id="browseCount">載入中…</div>
  </div>

  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="🔍 搜尋單字或中文…" oninput="debounceSearch()">
    <select id="filterStar" onchange="resetAndLoad()">
      <option value="">全部星等</option>
      <option value="5">⭐⭐⭐⭐⭐</option>
      <option value="4">⭐⭐⭐⭐</option>
      <option value="3">⭐⭐⭐</option>
      <option value="2">⭐⭐</option>
      <option value="1">⭐</option>
    </select>
    <select id="filterCategory" onchange="resetAndLoad()">
      <option value="">全部分類</option>
      <option>辦公日常</option><option>行銷與銷售</option><option>金融與會計</option><option>人力資源</option>
      <option>採購與物流</option><option>會議與簡報</option><option>科技與技術支援</option><option>一般專業</option>
      <option>溝通互動</option><option>旅遊與交通</option><option>住宿與餐飲</option><option>營運管理</option>
      <option>法務合規與安全</option><option>客戶服務</option><option>物業與不動產</option>
    </select>
    <select id="filterScore" onchange="resetAndLoad()">
      <option value="">全部分數段</option>
      <option value="0-400">0-400</option>
      <option value="400-600">400-600</option>
      <option value="600-780">600-780</option>
      <option value="780-900">780-900</option>
      <option value="900+">900+</option>
    </select>
  </div>

  <div class="loading-overlay" id="loadingState"><div class="spinner"></div><div>載入單字中…</div></div>

  <div class="words-grid" id="wordsGrid"></div>
  <button class="load-more-btn" id="btnLoadMore" style="display:none;" onclick="loadMore()">載入更多</button>
  <div id="endMsg" style="display:none;text-align:center;padding:1rem;color:var(--text-secondary);font-size:0.85rem;">已顯示全部單字</div>
  
  <div id="toastMsg" class="toast-msg">✨ 已為您恢復上次的瀏覽進度</div>
</div>

{% include 'vocab/components/word_modal.html' %}
{% endblock %}

{% block extra_js %}
<script>
let allWords = [];
let displayedWords = [];
let offset = 0;
const PAGE_SIZE = 100;
let totalAvailable = 0;
let loading = false;
let searchQuery = '';
let userProgress = {};

async function init() {
  // Load progress first (non-blocking)
  fetch('/vocab/api/progress').then(r => r.json()).then(p => { userProgress = p; renderWords(); });
  
  const savedLoaded = parseInt(sessionStorage.getItem('browse_loaded'), 10);
  const initialLength = (savedLoaded && savedLoaded > PAGE_SIZE) ? savedLoaded : PAGE_SIZE;
  
  await loadWords(initialLength);
  
  const savedScroll = parseInt(sessionStorage.getItem('browse_scrollY'), 10);
  if (savedScroll) {
    setTimeout(() => {
      window.scrollTo(0, savedScroll);
      const toast = document.getElementById('toastMsg');
      if (toast) {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
      }
    }, 100);
  }
}

window.addEventListener('beforeunload', () => {
  sessionStorage.setItem('browse_scrollY', window.scrollY);
  sessionStorage.setItem('browse_loaded', allWords.length);
});

async function loadWords(overrideLength = null) {
  if (loading) return;
  loading = true;

  const star = document.getElementById('filterStar').value;
  const category = document.getElementById('filterCategory').value;
  const score = document.getElementById('filterScore').value;
  const searchQ = document.getElementById('searchInput').value.trim();

  const fetchLength = overrideLength || PAGE_SIZE;
  let url = `/vocab/api/words?offset=${offset}&length=${fetchLength}`;
  if (star) url += `&star=${star}`;
  if (category) url += `&category=${encodeURIComponent(category)}`;
  if (score) url += `&score_range=${encodeURIComponent(score)}`;
  if (searchQ) url += `&search=${encodeURIComponent(searchQuery)}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) { console.error(data.error); loading = false; return; }

    allWords = allWords.concat(data.words);
    totalAvailable = data.total;
    offset += fetchLength;

    document.getElementById('loadingState').style.display = 'none';
    displayedWords = allWords; // 直接顯示後端返回的所有結果
    renderWords();

    const hasMore = offset < totalAvailable;
    document.getElementById('btnLoadMore').style.display = hasMore ? 'block' : 'none';
    document.getElementById('endMsg').style.display = hasMore ? 'none' : 'block';
  } catch(e) { console.error(e); }
  loading = false;
}

let searchTimeout = null;
function debounceSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = document.getElementById('searchInput').value.trim();
    resetAndLoad();
  }, 500);
}

function resetAndLoad() {
  sessionStorage.removeItem('browse_scrollY');
  sessionStorage.removeItem('browse_loaded');
  allWords = []; displayedWords = []; offset = 0;
  document.getElementById('wordsGrid').innerHTML = '';
  document.getElementById('btnLoadMore').style.display = 'none';
  document.getElementById('endMsg').style.display = 'none';
  document.getElementById('loadingState').style.display = 'flex';
  loadWords();
}

function renderWords() {
  const grid = document.getElementById('wordsGrid');
  grid.innerHTML = '';

  displayedWords.forEach((w, wIndex) => {
    const prog = userProgress[w.word];
    let dotClass = 'dot-new';
    if (prog) {
      dotClass = (prog.correct >= prog.incorrect && prog.correct > 0) ? 'dot-known' : 'dot-learning';
    }

    const example = (w.examples && w.examples.length > 0) ? w.examples[0] : null;
    const card = document.createElement('div');
    card.className = 'word-card';
    card.innerHTML = `
      <div class="wc-top">
        <div class="wc-word">
          <span class="progress-dot ${dotClass}"></span>
          <span style="color: var(--text-secondary); font-size: 0.85em; margin-right: 8px; font-weight: 500;">#${wIndex + 1}</span>${w.word}
          ${w.exam_tips && w.exam_tips.length > 0 ? `<button class="official-badge" onclick="openBrowseWordModal('${w.word.replace(/'/g, "\\'")}')" title="考試提示">i</button>` : ''}
        </div>
        <div class="wc-star">${'⭐'.repeat(w.star || 0)}</div>
      </div>
      <div class="wc-def">${w.definition || ''}</div>
      <div class="wc-pos">${(w.parts_of_speech || []).slice(0,3).map(p => `<span class="pos-tag">${p}</span>`).join('')}</div>
      ${example ? `<div class="wc-example"><em>${example.english || ''}</em><br>${example.chinese || ''}</div>` : ''}
      <div class="wc-cat">${w.category || ''}</div>
    `;
    grid.appendChild(card);
  });

  document.getElementById('browseCount').textContent = `顯示 ${displayedWords.length} / ${totalAvailable} 個單字`;
}

function loadMore() { loadWords(); }

function openBrowseWordModal(wordStr) {
  const w = allWords.find(x => x.word === wordStr);
  if (w) openWordModalByObj(w);
}

init();
</script>
{% endblock %}
