{% extends "base.html" %}

{% block title %}通知設定 | 薪水小幫手{% endblock %}

{% block content %}
<!-- Horizontal Navigation Bar -->
<div class="salary-nav">
    <a href="{{ url_for('salary.index') }}"
        class="salary-nav-item {% if request.endpoint == 'salary.index' %}active{% endif %}">
        📅 本週排班
    </a>
    <a href="{{ url_for('salary.monthly') }}"
        class="salary-nav-item {% if request.endpoint == 'salary.monthly' %}active{% endif %}">
        🗓️ 月曆檢視
    </a>
    <a href="{{ url_for('salary.history') }}"
        class="salary-nav-item {% if request.endpoint == 'salary.history' %}active{% endif %}">
        📜 歷史排班
    </a>
    <a href="{{ url_for('salary.notifications') }}"
        class="salary-nav-item {% if request.endpoint == 'salary.notifications' %}active{% endif %}">
        🔔 通知設定
    </a>
    <a href="{{ url_for('salary.settings') }}"
        class="salary-nav-item {% if request.endpoint == 'salary.settings' %}active{% endif %}">
        ⚙️ 設定
    </a>
</div>

<div class="settings-container">
    <div class="glass" style="padding: 24px;">
        <h3 style="margin: 0 0 8px 0; font-size: 1.25rem;">
            🔔 公司通知設定
        </h3>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px;">
            為每間公司設定專屬的發薪日提醒與每週工時摘要。若要修改接收通知的管道（LINE/Email），請前往 <a href="{{ url_for('auth.settings') }}" style="color: var(--accent-color); text-decoration: underline;">總設定</a>。
        </p>

        <div id="notifications-list">
            <div style="color: var(--text-secondary); font-size: 0.9rem; padding: 8px 0;">載入中…</div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let companiesCache = [];

async function loadCompanies() {
    try {
        const res = await fetch('{{ url_for("salary.get_companies") }}');
        if (!res.ok) return;
        companiesCache = await res.json();
        renderCompanies();
    } catch (err) {
        console.error(err);
    }
}

function renderCompanies() {
    const container = document.getElementById('notifications-list');
    if (!companiesCache.length) {
        container.innerHTML = '<div style="color: var(--text-secondary); font-size: 0.9rem;">您尚未建立任何公司，請先前往「設定」新增公司。</div>';
        return;
    }
    
    container.innerHTML = companiesCache.map(c => `
        <div class="glass" style="padding: 20px; margin-bottom: 16px; border-radius: 12px; border-left: 4px solid ${c.color}">
            <h4 style="margin: 0 0 16px 0; font-size: 1.1rem; color: ${c.color}">${c.name}</h4>
            
            <div class="notify-row" style="margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1;">
                    <input type="checkbox" id="cf-payday-enabled-${c.id}" ${c.notify_payday_enabled ? 'checked' : ''} style="width: 18px; height: 18px;"> 
                    <span>發薪日提醒</span>
                </label>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 0.85rem; color: var(--text-secondary);">每月第</span>
                    <input type="number" id="cf-payday-day-${c.id}" min="1" max="28" value="${c.notify_payday_day || 10}" class="settings-input" style="width: 60px; margin: 0; padding: 4px 8px;">
                    <span style="font-size: 0.85rem; color: var(--text-secondary);">號</span>
                    <input type="time" id="cf-payday-time-${c.id}" value="${c.notify_payday_time || '09:00'}" class="settings-input" style="margin: 0; padding: 4px 8px;">
                </div>
            </div>

            <div class="notify-row" style="margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1;">
                    <input type="checkbox" id="cf-weekly-enabled-${c.id}" ${c.notify_weekly_enabled ? 'checked' : ''} style="width: 18px; height: 18px;"> 
                    <span>每週工時摘要</span>
                </label>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <select id="cf-weekly-day-${c.id}" class="settings-input" style="margin: 0; padding: 4px 8px;">
                        <option value="monday" ${c.notify_weekly_day === 'monday' ? 'selected' : ''}>週一</option>
                        <option value="tuesday" ${c.notify_weekly_day === 'tuesday' ? 'selected' : ''}>週二</option>
                        <option value="wednesday" ${c.notify_weekly_day === 'wednesday' ? 'selected' : ''}>週三</option>
                        <option value="thursday" ${c.notify_weekly_day === 'thursday' ? 'selected' : ''}>週四</option>
                        <option value="friday" ${c.notify_weekly_day === 'friday' ? 'selected' : ''}>週五</option>
                        <option value="saturday" ${c.notify_weekly_day === 'saturday' ? 'selected' : ''}>週六</option>
                        <option value="sunday" ${c.notify_weekly_day === 'sunday' ? 'selected' : ''}>週日</option>
                    </select>
                    <input type="time" id="cf-weekly-time-${c.id}" value="${c.notify_weekly_time || '20:00'}" class="settings-input" style="margin: 0; padding: 4px 8px;">
                </div>
            </div>
            
            <div style="text-align: right;">
                <button class="btn btn-primary" onclick="saveNotifications(${c.id})" id="btn-save-${c.id}" style="padding: 6px 16px; font-size: 0.9rem;">儲存設定</button>
            </div>
        </div>
    `).join('');
}

async function saveNotifications(id) {
    const btn = document.getElementById(`btn-save-${id}`);
    const originalText = btn.textContent;
    btn.textContent = '儲存中...';
    btn.disabled = true;
    
    const payload = {
        notify_payday_enabled: document.getElementById(`cf-payday-enabled-${id}`).checked,
        notify_payday_day: parseInt(document.getElementById(`cf-payday-day-${id}`).value) || 10,
        notify_payday_time: document.getElementById(`cf-payday-time-${id}`).value,
        notify_weekly_enabled: document.getElementById(`cf-weekly-enabled-${id}`).checked,
        notify_weekly_day: document.getElementById(`cf-weekly-day-${id}`).value,
        notify_weekly_time: document.getElementById(`cf-weekly-time-${id}`).value,
    };

    try {
        const res = await fetch(`/salary/api/companies/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        
        if (res.ok) {
            btn.textContent = '✅ 已儲存';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
            }, 2000);
            // update cache
            const idx = companiesCache.findIndex(c => c.id === id);
            if(idx !== -1) {
                Object.assign(companiesCache[idx], payload);
            }
        } else {
            const err = await res.json();
            alert(err.error || '儲存失敗');
            btn.textContent = originalText;
            btn.disabled = false;
        }
    } catch (e) {
        alert('網路錯誤');
        btn.textContent = originalText;
        btn.disabled = false;
    }
}

document.addEventListener('DOMContentLoaded', loadCompanies);
</script>
{% endblock %}
