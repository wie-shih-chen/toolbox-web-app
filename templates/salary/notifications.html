{% extends "base.html" %}

{% block title %}通知設定 | 薪水小幫手{% endblock %}

{% block content %}
<!-- Horizontal Navigation Bar -->
<div class="salary-nav">
    <a href="{{ url_for('salary.monthly') }}"
        class="salary-nav-item {% if request.endpoint == 'salary.monthly' %}active{% endif %}">
        🗓️ 月曆檢視
    </a>
    <a href="{{ url_for('salary.history') }}"
        class="salary-nav-item {% if request.endpoint == 'salary.history' %}active{% endif %}">
        📜 歷史排班
    </a>
    <a href="{{ url_for('salary.notifications') }}"
        class="salary-nav-item {% if request.endpoint == 'salary.notifications' %}active{% endif %}">
        🔔 通知
    </a>
    <a href="{{ url_for('salary.settings') }}"
        class="salary-nav-item {% if request.endpoint == 'salary.settings' %}active{% endif %}">
        ⚙️ 設定
    </a>
</div>

<div class="settings-container">
    <div class="glass" style="padding: 24px;">
        <h3 style="margin: 0 0 8px 0; font-size: 1.25rem;">
            🔔 公司通知設定
        </h3>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px;">
            為每間公司設定專屬的發薪日提醒與每週工時摘要。若要修改接收通知的管道（LINE/Email），請前往 <a href="{{ url_for('auth.settings') }}" style="color: var(--accent-color); text-decoration: underline;">總設定</a>。
        </p>

        <div id="notifications-list">
            <div style="color: var(--text-secondary); font-size: 0.9rem; padding: 8px 0;">載入中…</div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let companiesCache = [];

async function loadCompanies() {
    try {
        const res = await fetch('{{ url_for("salary.get_companies") }}');
        if (!res.ok) return;
        companiesCache = await res.json();
        renderCompanies();
    } catch (err) {
        console.error(err);
    }
}

function renderCompanies() {
    const container = document.getElementById('notifications-list');
    if (!companiesCache.length) {
        container.innerHTML = '<div style="color: var(--text-secondary); font-size: 0.9rem;">您尚未建立任何公司，請先前往「設定」新增公司。</div>';
        return;
    }
    
    container.innerHTML = companiesCache.map(c => `
        <div class="glass" style="padding: 20px; margin-bottom: 16px; border-radius: 12px; border-left: 4px solid ${c.color}">
            <h4 style="margin: 0 0 16px 0; font-size: 1.1rem; color: ${c.color}">${c.name}</h4>
            
            <div class="notify-row" style="margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1;">
                    <input type="checkbox" id="cf-payday-enabled-${c.id}" ${c.notify_payday_enabled ? 'checked' : ''} onchange="debouncedSaveNotifications(${c.id})" style="width: 18px; height: 18px;"> 
                    <span>發薪日提醒</span>
                </label>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 0.85rem; color: var(--text-secondary);">每月第</span>
                    <input type="number" id="cf-payday-day-${c.id}" min="1" max="28" value="${c.notify_payday_day || 10}" oninput="debouncedSaveNotifications(${c.id})" class="settings-input" style="width: 60px; margin: 0; padding: 4px 8px;">
                    <span style="font-size: 0.85rem; color: var(--text-secondary);">號</span>
                    <input type="time" id="cf-payday-time-${c.id}" value="${c.notify_payday_time || '09:00'}" oninput="debouncedSaveNotifications(${c.id})" class="settings-input" style="margin: 0; padding: 4px 8px;">
                </div>
            </div>

            <div class="notify-row" style="margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1;">
                    <input type="checkbox" id="cf-weekly-enabled-${c.id}" ${c.notify_weekly_enabled ? 'checked' : ''} onchange="debouncedSaveNotifications(${c.id})" style="width: 18px; height: 18px;"> 
                    <span>每週工時摘要</span>
                </label>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <select id="cf-weekly-day-${c.id}" class="settings-input" onchange="debouncedSaveNotifications(${c.id})" style="margin: 0; padding: 4px 8px;">
                        <option value="monday" ${c.notify_weekly_day === 'monday' ? 'selected' : ''}>週一</option>
                        <option value="tuesday" ${c.notify_weekly_day === 'tuesday' ? 'selected' : ''}>週二</option>
                        <option value="wednesday" ${c.notify_weekly_day === 'wednesday' ? 'selected' : ''}>週三</option>
                        <option value="thursday" ${c.notify_weekly_day === 'thursday' ? 'selected' : ''}>週四</option>
                        <option value="friday" ${c.notify_weekly_day === 'friday' ? 'selected' : ''}>週五</option>
                        <option value="saturday" ${c.notify_weekly_day === 'saturday' ? 'selected' : ''}>週六</option>
                        <option value="sunday" ${c.notify_weekly_day === 'sunday' ? 'selected' : ''}>週日</option>
                    </select>
                    <input type="time" id="cf-weekly-time-${c.id}" value="${c.notify_weekly_time || '20:00'}" class="settings-input" oninput="debouncedSaveNotifications(${c.id})" style="margin: 0; padding: 4px 8px;">
                </div>
            </div>
            
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">
            <div style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
                <h5 style="margin: 0; font-size: 1rem; color: var(--text-primary);">排班提醒設定</h5>
                <button class="btn btn-secondary" onclick="addShiftReminder(${c.id}); debouncedSaveNotifications(${c.id})" style="padding: 4px 10px; font-size: 0.8rem;">+ 新增提醒</button>
            </div>
            
            <div id="sr-list-${c.id}" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;">
                ${(!c.shift_reminders || c.shift_reminders.length === 0) ? '<div class="empty-sr" style="color:var(--text-secondary); font-size:0.9rem;">尚無設定排班提醒。</div>' : c.shift_reminders.map((r) => {
                    const isBefore = r.offset_minutes < 0;
                    const isAfter = r.offset_minutes > 0;
                    const isExact = r.offset_minutes === 0;
                    const absOffset = Math.abs(r.offset_minutes);
                    return createReminderHTML(c.id, isExact ? 'exact' : (isBefore ? 'before' : 'after'), isExact ? 30 : absOffset, r.message_template);
                }).join('')}
            </div>

            <div style="background: rgba(0,0,0,0.15); border-radius: 8px; padding: 12px; margin-bottom: 20px;">
                <h6 style="margin: 0 0 8px 0; font-size: 0.9rem; color: var(--text-secondary);">⏰ 最近三次即將發送的排班提醒</h6>
                ${(!c.upcoming_schedules || c.upcoming_schedules.length === 0) 
                    ? '<div style="color:var(--text-secondary); font-size:0.85rem;">目前沒有即將發送的排班提醒。</div>' 
                    : c.upcoming_schedules.map(s => `
                        <div style="font-size: 0.85rem; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between;">
                            <div>
                                <span style="color: var(--accent-color); font-weight:600;">${s.notify_time.substring(5, 16).replace('-', '/')} 發送</span>
                                <span style="color: var(--text-secondary); margin-left: 8px;">(排班 ${s.shift_date.substring(5).replace('-', '/')} ${s.shift_start})</span>
                            </div>
                        </div>
                    `).join('')}
            </div>

            <div style="text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 8px;">
                <span id="save-status-${c.id}" style="font-size: 0.85rem; color: var(--text-secondary); opacity: 0; transition: opacity 0.3s;">✅ 已自動儲存</span>
                <button class="btn btn-primary" onclick="saveNotifications(${c.id})" id="btn-save-${c.id}" style="padding: 6px 16px; font-size: 0.9rem; display: none;">儲存設定</button>
            </div>
        </div>
    `).join('');
}

const saveTimeouts = {};
function debouncedSaveNotifications(id) {
    if (saveTimeouts[id]) clearTimeout(saveTimeouts[id]);
    const status = document.getElementById(`save-status-${id}`);
    if (status) {
        status.textContent = '儲存中...';
        status.style.opacity = '1';
    }
    saveTimeouts[id] = setTimeout(() => {
        saveNotifications(id, true);
    }, 800);
}

function createReminderHTML(companyId, type, offset, message) {
    const isExact = type === 'exact';
    const isBefore = type === 'before';
    const isAfter = type === 'after';
    
    return `
        <div class="shift-reminder-item" style="display:flex; align-items:center; gap:8px; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 6px; flex-wrap: wrap;">
            <select class="sr-type settings-input" onchange="toggleOffsetInput(this); debouncedSaveNotifications(${companyId})" style="width: auto; margin:0; padding:4px;">
                <option value="exact" ${isExact ? 'selected' : ''}>上班時間點</option>
                <option value="before" ${isBefore ? 'selected' : ''}>上班前</option>
                <option value="after" ${isAfter ? 'selected' : ''}>上班後</option>
            </select>
            <div class="sr-offset-container" style="${isExact ? 'display:none;' : 'display:flex; align-items:center; gap:4px;'}">
                <input type="number" class="sr-offset settings-input" oninput="debouncedSaveNotifications(${companyId})" min="1" max="1440" value="${offset}" style="width:50px; margin:0; padding:4px;">
                <span style="font-size:0.85rem; color:var(--text-secondary);">分鐘</span>
            </div>
            <input type="text" class="sr-message settings-input" oninput="debouncedSaveNotifications(${companyId})" placeholder="提醒內容 (支援變數 {time})" value="${message}" style="flex:1; min-width: 150px; margin:0; padding:4px;">
            <button class="btn" style="padding:4px; color:var(--danger-color); background:transparent; font-size:1.2rem; min-width:unset; line-height:1;" onclick="this.parentElement.remove(); checkEmpty(${companyId}); debouncedSaveNotifications(${companyId})">✕</button>
        </div>
    `;
}

function toggleOffsetInput(selectEl) {
    const container = selectEl.parentElement.querySelector('.sr-offset-container');
    if (selectEl.value === 'exact') {
        container.style.display = 'none';
    } else {
        container.style.display = 'flex';
    }
}

function addShiftReminder(companyId) {
    const list = document.getElementById(`sr-list-${companyId}`);
    const emptyMsg = list.querySelector('.empty-sr');
    if (emptyMsg) emptyMsg.remove();
    
    // Default to "exact" time
    const html = createReminderHTML(companyId, 'exact', 30, '記得打卡！');
    list.insertAdjacentHTML('beforeend', html);
}

function checkEmpty(companyId) {
    const list = document.getElementById(`sr-list-${companyId}`);
    if (list.children.length === 0) {
        list.innerHTML = '<div class="empty-sr" style="color:var(--text-secondary); font-size:0.9rem;">尚無設定排班提醒。</div>';
    }
}

async function saveNotifications(id, isAutoSave = false) {
    const btn = document.getElementById(`btn-save-${id}`);
    const statusText = document.getElementById(`save-status-${id}`);
    const originalText = btn.textContent;
    
    if (!isAutoSave) {
        btn.textContent = '儲存中...';
        btn.disabled = true;
    }
    
    // Collect shift reminders
    const srItems = document.querySelectorAll(`#sr-list-${id} .shift-reminder-item`);
    const shiftReminders = Array.from(srItems).map(item => {
        const type = item.querySelector('.sr-type').value;
        const offsetVal = parseInt(item.querySelector('.sr-offset').value) || 0;
        let offsetMinutes = 0;
        
        if (type === 'before') offsetMinutes = -offsetVal;
        else if (type === 'after') offsetMinutes = offsetVal;
        
        return {
            offset_minutes: offsetMinutes,
            message_template: item.querySelector('.sr-message').value.trim() || '記得打卡！'
        };
    });
    
    const payload = {
        notify_payday_enabled: document.getElementById(`cf-payday-enabled-${id}`).checked,
        notify_payday_day: parseInt(document.getElementById(`cf-payday-day-${id}`).value) || 10,
        notify_payday_time: document.getElementById(`cf-payday-time-${id}`).value,
        notify_weekly_enabled: document.getElementById(`cf-weekly-enabled-${id}`).checked,
        notify_weekly_day: document.getElementById(`cf-weekly-day-${id}`).value,
        notify_weekly_time: document.getElementById(`cf-weekly-time-${id}`).value,
        shift_reminders: shiftReminders
    };

    try {
        const res = await fetch(`/salary/api/companies/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        
        if (res.ok) {
            if (!isAutoSave) {
                btn.textContent = '✅ 已儲存';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.disabled = false;
                }, 2000);
            } else if (statusText) {
                statusText.textContent = '✅ 已自動儲存';
                setTimeout(() => {
                    statusText.style.opacity = '0';
                }, 2000);
            }
            
            // update cache quietly
            const idx = companiesCache.findIndex(c => c.id === id);
            if (idx !== -1) {
                companiesCache[idx].shift_reminders = shiftReminders;
            }
            if(idx !== -1) {
                Object.assign(companiesCache[idx], payload);
            }
        } else {
            const err = await res.json();
            alert(err.error || '儲存失敗');
            if (!isAutoSave) {
                btn.textContent = originalText;
                btn.disabled = false;
            } else if (statusText) {
                statusText.textContent = '❌ 儲存失敗';
            }
        }
    } catch (e) {
        alert('網路錯誤');
        if (!isAutoSave) {
            btn.textContent = originalText;
            btn.disabled = false;
        } else if (statusText) {
            statusText.textContent = '❌ 網路錯誤';
        }
    }
}

document.addEventListener('DOMContentLoaded', loadCompanies);
</script>
{% endblock %}
